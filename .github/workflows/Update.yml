name: Update

on:
  push:
  schedule:
    - cron: '0 1 */2 * *'

env:
  TZ: Asia/Shanghai

jobs:
  Update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: GetTime
      run: echo "GET_TIME=$(date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV

        
    - name: Update    
      run: |
        # 成人源
        rm -f Adult.m3u && wget http://adultiptv.net/chs.m3u -O Adult.m3u
        sed -i -n '/XXX/,+1p' Adult.m3u
        sed -i 's/XXX/成人频道/' Adult.m3u
        sed -i 's/AdultIPTV.net //g' Adult.m3u
        # wget https://raw.githubusercontent.com/YanG-1989/m3u/main/Adult.m3u -O AdultVideo.txt
        # sed -i -n '/日本/,+1p' AdultVideo.txt
        # sed -i 's/日本/成人视频/' AdultVideo.txt
        # echo '' >> Adult.m3u && cat AdultVideo.txt >> Adult.m3u
        # rm -f AdultVideo.txt
        sed -i '/^\s*$/d' Adult.m3u

        # 整合源
        rm -f IPTV.m3u && wget https://raw.githubusercontent.com/WuAdrian/source/main/tv.m3u -O IPTV.m3u
        #sed -i '/#EXTM3U/d' IPTV.m3u
        #sed -i '1i #EXTM3U' IPTV.m3u
        sed -i '/^\s*$/d' IPTV.m3u
        sed -i 's/-50-FPS$//g' IPTV.m3u
        sed -i 's/-HEVC$//g' IPTV.m3u
        sed -i 's/-高码$//g' IPTV.m3u
        sed -i 's/192.168.100.55/debian.wurunxiang.top/g' IPTV.m3u
        sed -i 's|https://epg.v1.mk/fy.xml|https://raw.githubusercontent.com/WuAdrian/source/main/tv.xml|g' IPTV.m3u
        

        # 节目源
        rm -f EPG.xml && wget https://raw.githubusercontent.com/WuAdrian/source/main/tv.xml -O EPG.xml
        echo "Auto Update IPTV in ${GET_TIME}" > README.md

    - name: Clean
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git checkout --orphan latest_branch
        git add -A
        git commit -am "${GET_TIME}"
        git branch -D Files
        git branch -m Files

    - name: Push
      run: git push -f origin Files
